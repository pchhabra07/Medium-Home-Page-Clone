name: Tests

on:
  push:
    paths:
      - 'automation/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: pip install pytest cssutils beautifulsoup4
      - name: Run tests
        run: pytest tests/